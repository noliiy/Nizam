services:
  postgres:
    image: postgres:16
    container_name: nizam-postgres
    environment:
      POSTGRES_DB: nizam
      POSTGRES_USER: nizam
      POSTGRES_PASSWORD: nizam
    ports:
      - "5432:5432"
    volumes:
      - nizam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nizam -d nizam"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nizam-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: nizam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nizam
      MINIO_ROOT_PASSWORD: nizamnizam
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - nizam_minio:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: nizam-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - nizam_n8n:/home/node/.n8n
      - ./n8n:/import

volumes:
  nizam_pgdata:
  nizam_minio:
  nizam_n8n:
